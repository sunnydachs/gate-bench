name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'

# The workflow's top level stays read-only; only the analyze job gets the
# SARIF-upload write (OpenSSF Scorecard scores top-level write permissions
# down). security-events: write uploads results; actions: read lets CodeQL
# enumerate workflow files for the security-extended queries.
permissions:
  contents: read

# One run per ref at a time; a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} / ${{ matrix.queries }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      contents: read         # check out the code
      actions: read          # enumerate workflow files (security-extended queries)

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            queries: security-extended

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # CodeQL FAILS the job when it finds no source for the configured language
    # ("no code was seen during the build"), so a repository that has not chosen
    # its language yet - like this template - has to skip cleanly instead.
    # Remove this guard once the repo has source in ${{ matrix.language }}.
    - name: Detect source for ${{ matrix.language }}
      id: detect
      run: |
        case "${{ matrix.language }}" in
          javascript-typescript)
            pattern='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$' ;;
          python)
            pattern='\.py$' ;;
          *)
            pattern='\.' ;;
        esac
        count=$(find . -type f -regextype posix-extended -regex ".*${pattern}" \
                  -not -path './.git/*' -not -path './node_modules/*' | wc -l)
        echo "files=$count" >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "No source files for ${{ matrix.language }} - skipping the analysis."
        fi

    - name: Initialize CodeQL
      if: steps.detect.outputs.files != '0'
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        queries: ${{ matrix.queries }}

    - name: Perform CodeQL Analysis
      if: steps.detect.outputs.files != '0'
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{ matrix.language }}/queries:${{ matrix.queries }}"
