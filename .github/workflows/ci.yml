name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# contents: read only — the test job needs nothing else. Keeps a compromised
# dependency from pushing to the repo during a test run.
permissions:
  contents: read

# One run per ref at a time; a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Only lines that still receive security patches.
        # scripts/check_runtimes.py fails the build if this list goes stale.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # CI needs no push credentials; drop the persisted auth header so a
        # later step cannot leak it.
        persist-credentials: false

    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests
      run: python -m pytest -q
