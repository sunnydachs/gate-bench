name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# contents: read only — the test job needs nothing else. Keeps a compromised
# dependency from pushing to the repo during a test run.
permissions:
  contents: read

# One run per ref at a time; a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Only lines that still receive security patches. Node 18 (EOL
        # 2025-04-30) and 20 (EOL 2026-04-30) used to be listed here, so the
        # matrix was green on runtimes nobody patches any more.
        # scripts/check_runtimes.py fails the build if this list goes stale.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # CI needs no push credentials; drop the persisted auth header so a
        # later step cannot leak it.
        persist-credentials: false

    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
        # NOTE: no `cache: 'npm'` here. setup-node fails the job outright when the
        # lock file it wants to hash does not exist, which makes a fresh repo red
        # before it has any code. Add the cache back once package-lock.json is
        # committed.

    # A template has no application code yet, so the job detects the stack and
    # does the right thing instead of failing on a missing manifest. Delete this
    # step (and the guards below) once the repo has one stack.
    - name: Detect the project stack
      id: stack
      run: |
        if [ -f package.json ]; then
          echo "kind=node" >> "$GITHUB_OUTPUT"
        elif [ -f pyproject.toml ]; then
          echo "kind=python" >> "$GITHUB_OUTPUT"
        else
          echo "kind=none" >> "$GITHUB_OUTPUT"
        fi

    - name: No manifest yet
      if: steps.stack.outputs.kind == 'none'
      run: echo "No package.json or pyproject.toml yet - nothing to test. This is expected for the template repository itself."

    - name: Set up Python
      if: steps.stack.outputs.kind == 'python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install (python)
      if: steps.stack.outputs.kind == 'python'
      run: pip install -e ".[dev]"

    - name: Run tests (python)
      if: steps.stack.outputs.kind == 'python'
      run: python -m pytest -q

    - name: Install dependencies (node)
      if: steps.stack.outputs.kind == 'node'
      run: npm install

    - name: Run tests (node)
      if: steps.stack.outputs.kind == 'node'
      run: npm test

    # Optional: Codecov upload. Requires CODECOV_TOKEN in repo secrets.
    - name: Generate coverage (Node 20.x only)
      if: matrix.node-version == '20.x' && steps.stack.outputs.kind == 'node'
      run: npx --yes c8 --reporter=text-lcov --reporter=text npm test

    - name: Upload coverage to Codecov (Node 20.x only)
      if: matrix.node-version == '20.x' && steps.stack.outputs.kind == 'node'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        files: ./coverage/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
