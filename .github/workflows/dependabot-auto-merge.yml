name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Top level stays read-only (OpenSSF Scorecard scores top-level writes down);
# only the merge job gets the writes it actually needs.
permissions:
  contents: read

# One merge attempt per PR at a time; a newer push to the same PR supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: dependabot-auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write      # merge the Dependabot PR
      pull-requests: write # set auto-merge on it
    # Only fire for Dependabot's own PRs. Other PRs go through normal review.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The step name and the README both say patch/minor/security; the condition
      # was missing semver-minor, so minor bumps - the bulk of Dependabot's PRs -
      # never auto-merged. Keep the condition in step with the name.
      - name: Auto-merge patch, minor and security updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'security-update'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
